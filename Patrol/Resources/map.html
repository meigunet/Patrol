<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>巡护地图</title>
  <link rel="stylesheet" href="./leaflet/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    /* 注意：不使用 inset 简写（Chrome 87+ 才支持，旧版 WebView 上会导致元素尺寸为 0 → 地图全白） */
    /* 指南针跟随模式下整体旋转地图（JS 设置 transform）；过渡让转向更顺 */
    /* build114：用 100vh 兜底容器高度。
       根因（build113 诊断实测）：任务页 WebView 视口是 383x344，但 Leaflet 容器
       getSize() 报 383x0 —— html/body 的 height:100% 在早期布局时被算成 0，
       之后 WebView 拿到真实尺寸也没有重算，于是绝对定位的 #map（top/bottom:0）
       高度为 0：既不请求瓦片（tileload/tileerror 都不触发）也不报错，整片空白。
       vh 直接以视口为基准，不依赖父级百分比高度，因此不受这个缺陷影响。 */
    #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; height: 100vh; width: 100vw; background: #eef3ea; transition: transform .18s ease-out; }
    #bar {
      position: absolute; top: 8px; left: 8px; right: 8px; z-index: 1000;
      background: rgba(20,80,30,0.94); color: #fff; font-size: 14px;
      padding: 8px 12px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.3);
      display: flex; flex-wrap: wrap; align-items: center;
    }
    #bar span { margin-right: 14px; }
    #bar b { font-weight: 700; font-size: 15px; }
    #status { margin-left: auto; font-size: 12px; opacity: .95; }
    .legend { background: rgba(255,255,255,.94); color:#222; padding:6px 10px; border-radius:8px; font-size:13px; position:absolute; top:64px; right:10px; z-index:1000; box-shadow:0 1px 5px rgba(0,0,0,.25); line-height:1.7; }
    .dot { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:5px; vertical-align:middle; border:1px solid #fff; }
    .leaflet-popup-content { font-size: 13px; line-height: 1.6; white-space: pre-line; }
    .ctr-label { background: rgba(20,80,30,.9); color:#fff; border:none; box-shadow:none; font-size:12px; font-weight:600; padding:2px 6px; border-radius:4px; }
    .ctr-label:before { border-top-color: rgba(20,80,30,.9); }
    /* 图层标注文字（服务端「图层管理」配置的标注字段）：浅色底 + 图层色文字，地形底图上也干净可读 */
    .layer-label {
      background: rgba(255,255,255,.85); border: none; box-shadow: none; padding: 0 4px; margin: 0;
      color: #1b3b1f; font-size: 11px; font-weight: 700; white-space: nowrap; border-radius: 3px;
    }
    .layer-label:before { display: none; }
    /* build112：低缩放级别下隐藏图层常驻标注（如 352 个网格面的编号）——
       缩小时几百个标注互相叠加成一团乱码，看起来像「网格和标注对不上」；
       放大到 LABEL_ZOOM_MIN 以上才显示（与网页端 build107 的阈值策略一致） */
    .labels-off .leaflet-tooltip.layer-label { display: none !important; }
    /* 我的位置：蓝色箭头（指向正北，按设备朝向旋转）+ 白边描边，任何底图上都清晰 */
    .me-arrow { position: absolute; inset: 0; transition: transform .18s linear; }
    /* build120（按用户要求）：定位图标 = **实心圆点 + 圆外箭头**，箭头随指南针朝向旋转。
       圆点固定表示"位置"，箭头表示"朝向"，两者分离更接近常见导航地图的习惯。 */
    /* build138：按参考图重做定位图标——蓝色实心大点 + 白色描边 + 上方三角箭头；
       外侧另画一个「精度圈」（灰色半透明，半径 = GPS 水平精度米数，精度越高圈越小）。
       去掉 drop-shadow 滤镜：部分 WebView 下阴影会随定位刷新反复重绘，看着"一闪一闪"。 */
    /* build166：定位点重绘 ——
       ① 精度圈（浅灰填充 + 白色描边，尺寸由 GPS 精度决定）；
       ② **白色圆底**（细描边 + 轻阴影）作为定位针的底座，浅色/深色底图都看得清；
       ③ 白圆内的**蓝色导航箭头**随设备朝向旋转（完全落在圆内，不再像旧版那样拖着尾巴伸到圈外）。
       旧版是「蓝圆点 + 圈外长尾巴箭头」，放大后像一根针，观感差。 */
    /* build167（按用户要求）：定位图标**固定大小**，不再随 GPS 精度放大缩小；
       尺寸只比采集点（16px 蓝点）大一点 → 24px。白底圆 + 蓝箭头整体 24×24。 */
    /* build179：build178 的「缩到 20px + 白圆半透明」已撤回——
       用户要的是「定位点盖在航迹之上」，不是让图标变小变透明。
       现在恢复 24px 实心白圆，层级改为最高（mePane z=670，仍低于气泡层）。 */
    .me-dot { position: relative; width: 24px; height: 24px; }
    .me-head { position: absolute; inset: 0; transform-origin: 50% 50%; }
    .me-badge {
      position: absolute; left: 0; top: 0; width: 24px; height: 24px;
      border-radius: 50%; background: #FFFFFF; box-sizing: border-box;
      box-shadow: 0 1px 2px rgba(0,0,0,.32), 0 0 0 1px rgba(0,0,0,.06);
    }
    /* 精度圈已取消（build167）：原来尺寸随 GPS 精度在 34~86px 之间变，用户看着像"图标自己在放大缩小"。
       现在只保留一个固定的白色圆底，位置精度不再影响图标大小。 */
    /* 加载遮罩：高对比可读 */
    #loading {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 2000; display: flex; align-items: center; justify-content: center;
      background: rgba(232,242,228,.92); color: #14481e; font-size: 16px; font-weight: 600; flex-direction: column;
    }
    #loading .spin { width: 30px; height: 30px; border: 3px solid #b7d9b0; border-top-color: #2e7d32; border-radius: 50%; animation: sp 0.9s linear infinite; margin-bottom: 10px; }
    @keyframes sp { to { transform: rotate(360deg); } }
    /* 错误条：可读 */
    #err {
      position: absolute; top: 60px; left: 10px; right: 10px; z-index: 1500; display: none;
      background: #b3261e; color: #fff; font-size: 13px; padding: 8px 12px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.3); line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="bar">
    <span><b>美姑大风顶保护区</b></span>
    <span>图层 <b id="c-layer">0</b></span>
    <span>记录 <b id="c-rec">0</b></span>
    <span>在线 <b id="c-on">0</b></span>
    <span id="status">初始化…</span>
  </div>
  <div id="err"></div>
  <div id="map"></div>
  <div class="legend">
    <div><span class="dot" style="background:#2563EB"></span>采集点</div>
    <div><span class="dot" style="background:#16A34A"></span>在线人员</div>
    <div><span class="dot" style="background:#9CA3AF"></span>离线人员</div>
  </div>
  <div id="loading"><div class="spin"></div><div>正在加载地图数据…</div></div>

  <script src="./leaflet/leaflet.js"></script>
  <script>
    var q = new URLSearchParams(location.search);
    var server = (q.get('server') || '').replace(/\/+$/, '');
    if (!server) server = location.origin + '/api';
    var serverRoot = server.replace(/\/api$/, '');
    var token = q.get('token') || '';
    // 宿主（App）自带顶栏时可传 chrome=0，隐藏本页顶部信息条，避免"顶部被两层标题盖住"
    var chrome = q.get('chrome') !== '0';
    // 底图按服务端 map-config 的 key 选择（satellite / online）
    var basemap = q.get('basemap') || 'satellite';
    var errEl = document.getElementById('err');
    var statusEl = document.getElementById('status');
    function setStatus(t) { statusEl.textContent = t; }
    function showErr(t) {
      // 401 = token 失效，给出可操作的提示（正常会被 App 的自动刷新兜住）
      if (String(t).indexOf('401') >= 0) t = '登录已过期：请到「我的」页退出登录后重新登录';
      errEl.textContent = t; errEl.style.display = 'block';
    }
    function hideErr() { errEl.style.display = 'none'; }
    // 离线判定：无网络时数据接口必然失败，不应当成“接口异常”吓用户（离线切图也走这里）
    function isOffline() { try { return navigator.onLine === false; } catch (e) { return false; } }
    // fetch 真实拉不到网（即便 onLine 误报 true）会抛 TypeError / Failed to fetch，也按离线处理
    function isNetworkError(e) {
      if (!e) return false;
      var s = ((e.name || '') + ' ' + (e.message || ''));
      return /TypeError|Failed to fetch|NetworkError|Network request failed/i.test(s);
    }
    function dataErr(label, e) {
      if (isOffline() || isNetworkError(e)) {
        setStatus('离线，' + label + '数据不可用');
        hideErr();
      } else {
        setStatus(label + '加载失败');
        showErr(label + '接口异常：' + (e && e.message ? e.message : e));
      }
    }

    function api(path) {
      var url = serverRoot + '/api/' + path.replace(/^\//, '');
      return fetch(url, { headers: token ? { 'Authorization': 'Bearer ' + token } : {} })
        .then(function (r) { if (!r.ok) throw new Error(path + ' → HTTP ' + r.status); return r.json(); });
    }
    function api2(url) {
      return fetch(url, { headers: token ? { 'Authorization': 'Bearer ' + token } : {} })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .catch(function () { return null; });
    }

    var CENTER = [28.6673, 103.105];
    // 支持从 URL 恢复视野（App 端在"清除不掉就重载页面"的兜底路径上会带上当前中心/缩放，
    // 这样重载后用户看到的还是同一块地方，不会突然跳回全区）
    var initView = null, initZoom = 11;
    try {
      var c = q.get('c');
      if (c) {
        var parts = c.split(',');
        if (parts.length >= 2) {
          var la = parseFloat(parts[0]), ln = parseFloat(parts[1]);
          if (isFinite(la) && isFinite(ln)) initView = [la, ln];
        }
      }
      var z = parseInt(q.get('z') || '', 10);
      if (isFinite(z)) initZoom = z;
    } catch (e) {}
    // build134：**照搬 WEB 端的渲染方式**——矢量图层用 Canvas 渲染（preferCanvas:true）。
    // WEB 端（MapPanel.vue）一直用 preferCanvas，从未出现"加图层变形"；
    // 而 App 之前用 Leaflet 默认的 SVG 渲染：每个要素是一个 <path> DOM，
    // 图层增删/尺寸变化时 rootGroup 的变换会残留，导致已有图层跟着变形/位移。
    // Canvas 每次 _update 整体重绘，天然不会残留，这也是 WEB 端正常的根本原因。
    var map = L.map('map', {
      zoomControl: true,
      // 右下角那条「Leaflet | © …」版权条按用户要求去掉（WEB 端 MapPanel 同步关闭）
      attributionControl: false,
      preferCanvas: true,
      // build141：**彻底关闭缩放/淡入/标记动画**。
      // 只关 markerZoomAnimation 不够——地图的 zoomAnimation 会在缩放过程中对标记施加
      // 临时 scale（约 0.7x 等），于是圆点/三角"一会大一会小"、看着像在闪。
      // 关掉后缩放直接切到新层级（瓦片瞬时重绘），标记永远保持固定像素大小。
      zoomAnimation: false,
      fadeAnimation: false,
      markerZoomAnimation: false
    }).setView(initView || CENTER, initZoom);
    var scaleCtrl = L.control.scale({ imperial: false }).addTo(map);
    // build131：图层增删后**强制按当前容器尺寸重绘**。
    // 现场实测：同一视野下，多加载一个图层后，已有图层（蓝色网格）形状/位置才"跳"到正确形状——
    // 说明首个图层绘制时渲染器用的还是旧尺寸（被压扁），直到下一次图层变动才重算。
    // 这里在每次图层增删后重算地图尺寸并逐层 redraw，保证一开始就是正确比例。
    function redrawVectors() {
      var renderers = [];
      try {
        for (var id2 in layerGroups) {
          var g = layerGroups[id2];
          if (!g || !map.hasLayer(g)) continue;
          if (g.eachLayer) g.eachLayer(function (ly) {
            try { if (ly._renderer && renderers.indexOf(ly._renderer) < 0) renderers.push(ly._renderer); } catch (e) {}
            try { if (ly.redraw) ly.redraw(); } catch (e) {}
          });
        }
      } catch (e) {}
      // Leaflet 的渲染器挂在每个 path 的 _renderer 上（map._renderer 并不存在），
      // 必须拿到真实渲染器实例再 _update，才能把 rootGroup 的残留缩放松/位移复位。
      renderers.forEach(function (r) { try { if (r._update) r._update(); } catch (e) {} });
      // 兜底：触发一次 moveend，让所有渲染器按当前视野/尺寸重算。
      try { map.fire('moveend'); } catch (e) {}
    }
    // build127：航迹线专用图层，zIndex 高于 markerPane(600)——避免橙色折线被采集点蓝点
    // 整个压住，导致"只看到一堆点、看不到线"（用户反复反馈"航迹线没有"）。
    try {
      // build179（按用户要求）：**本人定位点专用 pane，z 最高（670，仍低于 popup 700）**——
      // 记录航迹时橙色航迹线正好经过当前位置，定位图标必须压在航迹和采集点之上，
      // 否则看不清自己现在在哪。（build178 曾把它放到最底层 580，方向搞反了，已撤回。）
      map.createPane('mePane');
      var meEl = map.getPane('mePane');
      meEl.style.zIndex = 670;
      meEl.style.pointerEvents = 'none';
      map.createPane('tracePane');
      var tpEl = map.getPane('tracePane');
      tpEl.style.zIndex = 630;
      tpEl.style.pointerEvents = 'none';
      // build152：「起」「终」圆点要压在橙色航迹线之上（否则线正好从圆点中间穿过、把字压住）
      map.createPane('traceTopPane');
      var ttEl = map.getPane('traceTopPane');
      ttEl.style.zIndex = 640;
      ttEl.style.pointerEvents = 'none';
      // build162（按用户要求）：**采集点要盖住航迹线**，不是线盖住点。
      // 之前采集点用默认 markerPane（z=600），航迹线在 tracePane（z=630）之上，
      // 一条粗线正好从蓝点中间穿过，把点压得看不清。这里单独给采集点一个更高的 pane。
      // 注意：这个 pane 必须可点击（弹出「填写的表格名称」），不能设 pointerEvents:none。
      map.createPane('recordPane');
      var rpEl = map.getPane('recordPane');
      rpEl.style.zIndex = 650;
      rpEl.style.pointerEvents = 'auto';
    } catch (e) {}

    // 默认标记图标路径（相对本页，确保 assets 内图片可加载）
    try {
      L.Icon.Default.prototype.options.iconUrl = './leaflet/images/marker-icon.png';
      L.Icon.Default.prototype.options.iconRetinaUrl = './leaflet/images/marker-icon-2x.png';
      L.Icon.Default.prototype.options.shadowUrl = './leaflet/images/marker-shadow.png';
    } catch (e) {}

    // WebView 中地图容器常在 JS 初始化后才完成布局，需手动 invalidateSize，否则地图空白。
    // 老版 WebView 布局视口高度可能为 0 且不随视图尺寸变化重新布局，这里用 JS 显式设定像素尺寸兜底。
    var mapEl = document.getElementById('map');
    function sizeMap() {
      try {
        // build114：优先取「较大的那个」——老 WebView 上 innerHeight 可能比实际可视区小
        // （或早期为 0），documentElement.clientHeight 更贴近真实可视高度。
        var sw = (window.screen && window.screen.width) ? window.screen.width : 0;
        var sh = (window.screen && window.screen.height) ? window.screen.height : 0;
        // build126：地图 div 必须**等于 WebView 可视区**，绝不能取物理屏幕尺寸。
        // build124 用 screen 尺寸兜底，把任务页（地图卡片仅屏高 42%）的 #map 撑成
        // 整屏高（412x915）——WebView 实际只有上面一小块可见，Leaflet 的视野中心、
        // 瓦片请求范围全部错位，表现就是"点/线能画出来，但底图一张瓦片都不出"。
        var w = Math.max(mapEl.clientWidth || 0, window.innerWidth || 0, document.documentElement.clientWidth || 0);
        var h = Math.max(mapEl.clientHeight || 0, window.innerHeight || 0, document.documentElement.clientHeight || 0);
        if (w < 60 && sw > 50) w = sw;   // 仅在视口确实拿不到时才用物理屏幕兜底
        if (h < 60 && sh > 50) h = sh;
        if (w > 50) mapEl.style.width = w + 'px';
        if (h > 50) mapEl.style.height = h + 'px';
      } catch (e) {}
    }
    function fixSize() {
      sizeMap();
      try { map.invalidateSize(); } catch (e) {}
      // build126：尺寸就绪后补做延迟的 fitBounds（任务页没有 GPS 纠正视野，必须靠这里）
      try {
        if (pendingFit && !traceFitted) {
          var all = pendingFit, sz = map.getSize();
          if (sz && sz.x >= 60 && sz.y >= 60) {
            pendingFit = null;
            if (all.length === 1) map.setView(all[0], Math.max(map.getZoom() || 0, 15));
            else map.fitBounds(L.latLngBounds(all), { padding: [40, 40] });
            traceFitted = true;
          }
        }
      } catch (e) {}
    }
    // 供 App 主动触发（页面就绪后 WebView 才真正拿到尺寸时用）
    window.fixSizeNow = fixSize;
    // build114：**自愈循环**——容器尺寸为 0 时持续重试（每 800ms），直到拿到真实高度。
    // build113 的诊断证明：真正的问题不是"没有重试"，而是几次固定重试都发生在
    // WebView 给出真实尺寸之前，之后再也不重试 → 容器永远 0 高、地图永远空白。
    setInterval(function () {
      try {
        var s = map.getSize();
        if (s.x < 60 || s.y < 60) fixSize();
      } catch (e) {}
    }, 800);
    window.addEventListener('load', fixSize);
    window.addEventListener('resize', fixSize);
    setTimeout(fixSize, 200); setTimeout(fixSize, 600); setTimeout(fixSize, 1500); setTimeout(fixSize, 3000);
    // 自诊断：容器尺寸异常时明示；多次重试 sizeMap，恢复后自动清除错误条
    function checkSize() {
      try {
        var s = map.getSize();
        if (s.x < 60 || s.y < 60) {
          sizeMap(); map.invalidateSize();
          s = map.getSize();
        }
        if (s.x < 60 || s.y < 60) {
          showErr('地图容器尺寸异常：' + s.x + 'x' + s.y + '（视口 ' + window.innerWidth + 'x' + window.innerHeight + '）');
        } else {
          hideErr();
        }
      } catch (e) {}
    }
    setTimeout(checkSize, 1800); setTimeout(checkSize, 4000); setTimeout(checkSize, 8000);

    // 顶部信息条：宿主已有顶栏时隐藏，并把图例上移到顶部
    (function applyChrome() {
      if (!chrome) {
        var bar = document.getElementById('bar');
        if (bar) bar.style.display = 'none';
        var lg = document.querySelector('.legend');
        if (lg) lg.style.top = '10px';
        var e = document.getElementById('err');
        if (e) e.style.top = '10px';
      }
    })();

    // 离线经纬网格已按需求移除（不再绘制网格线）

    // 在线瓦片：按服务端底图配置（basemap）选择。
    // 内置底图：卫星影像（Esri World Imagery）+ 离线地图（不请求在线瓦片，只显示矢量图层与点位）。
    // 街道/地形等统一走网页端「地图管理 → 在线地图 / WMTS」。
    var TILES = {
      // build123：用户要求换回卫星影像（Esri World Imagery），仍走服务器代拉。
      satellite: { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', attr: '© Esri World Imagery' }
    };
    // 当前底图的瓦片层：切底图时先移除旧的，避免多张瓦片叠在一起
    var baseLayer = null;

     * 递归数测量要素：必须进到图层组（LayerGroup）内部统计。
     * 坑：map.eachLayer() 只遍历直接加到 map 上的图层，不递归图层组，
     * 之前的写法恒返回 0，App 端以为"已经清干净"而从未重试 —— 点就一直留在地图上。
     */
    function countMeasureIn(l, depth) {
      if (!l || depth > 5) return 0;
      var c = l.__measure ? 1 : 0;
      if (typeof l.eachLayer === 'function') {
        try { l.eachLayer(function (sub) { c += countMeasureIn(sub, depth + 1); }); } catch (e) {}
      }
      return c;
    }
    window.measureCount = function () {
      var n = 0;
      try { map.eachLayer(function (l) { n += countMeasureIn(l, 0); }); } catch (e) {}
      return n;
    };
    function redrawMeasure() {
      dropMeasureLayers();
      measurePts.forEach(function (p) {
        var dot = L.circleMarker([p.lat, p.lng], {
          radius: 4, color: '#ffffff', weight: 1.5, fillColor: '#E65100', fillOpacity: 1,
          renderer: measureRenderer || undefined
        });
        dot.__measure = true;
        measureDots.push(dot);
        if (measureGroup) measureGroup.addLayer(dot); else dot.addTo(map);
      });
      if (measurePts.length < 2) return;
      var latlngs = measurePts.map(function (p) { return [p.lat, p.lng]; });
      if (measureMode === 'area') {
        measureLayer = L.polygon(latlngs, {
          color: '#E65100', weight: 3, fillColor: '#E65100', fillOpacity: 0.2,
          renderer: measureRenderer || undefined
        });
      } else {
        measureLayer = L.polyline(latlngs, {
          color: '#E65100', weight: 3.5, opacity: 0.95,
          renderer: measureRenderer || undefined
        });
      }
      measureLayer.__measure = true;
      if (measureGroup) measureGroup.addLayer(measureLayer); else measureLayer.addTo(map);
    }
    function measureText() {
      var n = measurePts.length;
      if (measureMode === 'length') {
        return n < 2 ? '已取 1 点，继续点击下一点' : n + ' 点 · 长度 ' + fmtLen(pathLen(measurePts));
      }
      if (measureMode === 'area') {
        return n < 3 ? '已取 ' + n + ' 点，至少 3 点' : n + ' 点 · 面积 ' + fmtArea(polyArea(measurePts));
      }
      return '';
    }
    function doClearMeasure() {
      dropMeasureLayers();
      measurePts = [];
      if (measureMode) report('点击地图取点');
    }
    map.on('click', function (e) {
      if (!measureMode || !e || !e.latlng) return;
      measurePts.push({ lat: e.latlng.lat, lng: e.latlng.lng });
      redrawMeasure();
      report(measureText());
    });

    /**
     * 硬清除：不依赖"发指令后过一会儿再回读"的时序，在同一次 JS 调用里
     * 直接把所有测量要素从地图上摘掉，并同步返回清除后的剩余数量。
     * 之前 App 端反复发 clearMeasure 还是"清不掉"，根因就是清除与计数分两次
     * 执行、中间还夹着重绘，任何一环慢下来读数就还是旧的。
     */
    window.hardClearMeasure = function () {
      var removed = 0;
      // 1. 直接子层：测量点是通过图层组加到地图的，同时也是 map 的直接子层，逐个摘
      var stack = [];
      try { map.eachLayer(function (l) { stack.push(l); }); } catch (e) {}
      stack.forEach(function (l) {
        if (!l) return;
        if (l.__measure) { try { map.removeLayer(l); removed++; } catch (e) {} }
        // 图层组：组内可能还挂着（被 addLayer 进来但父组没同步清的）测量要素
        if (typeof l.eachLayer === 'function') {
          var inner = [];
          try { l.eachLayer(function (s) { inner.push(s); }); } catch (e) {}
          inner.forEach(function (s) {
            if (s && s.__measure) { try { map.removeLayer(s); removed++; } catch (e) {} }
          });
        }
      });
      // 2. 测量图层组整组摘掉再重建，杜绝任何残留引用
      try { if (measureGroup) map.removeLayer(measureGroup); } catch (e) {}
      measureGroup = null;
      try { measureGroup = L.layerGroup().addTo(map); } catch (e) { measureGroup = null; }
      // 3. 状态归零
      measurePts = [];
      measureDots = [];
      measureLayer = null;
      // 4. 强制重绘（canvas 渲染器 + 地图）
      try { if (measureRenderer && measureRenderer._update) measureRenderer._update(); } catch (e) {}
      try { if (map._renderer && map._renderer._update) map._renderer._update(); } catch (e) {}
      try { map.invalidateSize({ animate: false }); } catch (e) {}
      // 5. 同步返回剩余数量（0 = 真清干净了）
      return window.measureCount();
    };

    /**
     * 地图视图变换（指南针跟随旋转）。
     * 实现方式：CSS transform 整体变换 #map 容器。变换期间 Leaflet 的指针坐标
     * 会与视觉错位，因此禁用拖拽/双击缩放/双指缩放（只看不拖，退出即恢复）。
     *
     * - 2D 旋转（deg≠0）：按容器宽高与角度**动态计算放大倍数**，保证旋转后
     *   四角不露出空白（早期写死 scale(1.4)，竖屏转 45° 左右时两角会空白）。
     */
    var mapRot = 0;      // 方位旋转角（度，0 = 北在上）
    function applyMapTransform() {
      try {
        var el = document.getElementById('map');
        if (!el) return;
        var w = el.clientWidth || el.offsetWidth || 1;
        var h = el.clientHeight || el.offsetHeight || 1;
        var t = '';
        if (mapRot) {
          var rad = mapRot * Math.PI / 180;
          var cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
          // 旋转后包围盒恰能覆盖容器所需的最小倍数（宽/高取更紧的一边），再留 3% 余量
          var need = Math.max((w * cos + h * sin) / w, (w * sin + h * cos) / h);
          t = 'rotate(' + mapRot + 'deg) scale(' + (need * 1.03).toFixed(3) + ')';
        }
        el.style.transform = t;
        // 变换期间禁用会错位的交互（程序化定位/设置视野不受影响）
        var locked = !!mapRot;
        try {
          if (locked) {
            if (map.dragging && map.dragging.disable) map.dragging.disable();
            if (map.doubleClickZoom && map.doubleClickZoom.disable) map.doubleClickZoom.disable();
            if (map.touchZoom && map.touchZoom.disable) map.touchZoom.disable();
            if (map.scrollWheelZoom && map.scrollWheelZoom.disable) map.scrollWheelZoom.disable();
          } else {
            if (map.dragging && map.dragging.enable) map.dragging.enable();
            if (map.doubleClickZoom && map.doubleClickZoom.enable) map.doubleClickZoom.enable();
            if (map.touchZoom && map.touchZoom.enable) map.touchZoom.enable();
            if (map.scrollWheelZoom && map.scrollWheelZoom.enable) map.scrollWheelZoom.enable();
          }
        } catch (e) {}
      } catch (e) {}
    }
    /** 指南针跟随：设置方位旋转角（度）。0 / null = 恢复"北在上" */
    window.setMapRotation = function (deg) {
      mapRot = parseFloat(deg) || 0;
      applyMapTransform();
    };
    /** 页面就绪后由 App 补发当前应有的变换状态（旋转） */
    window.mapTransformState = function () { return { rot: mapRot }; };

    /** 当前地图视野 "lat,lng,zoom"（App 端重载兜底时带上，保持用户不看的地方不变） */
    window.mapView = function () {
      try {
        var c = map.getCenter();
        return c.lat.toFixed(6) + ',' + c.lng.toFixed(6) + ',' + map.getZoom();
      } catch (e) { return ''; }
    };

    /** 诊断用：把页面侧真实状态原样返回，便于定位"为什么清不掉" */
    window.measureDebug = function () {
      var direct = 0, inGroup = 0, groups = 0;
      try {
        map.eachLayer(function (l) {
          if (l.__measure) direct++;
          if (typeof l.eachLayer === 'function') {
            groups++;
            l.eachLayer(function (s) { if (s && s.__measure) inGroup++; });
          }
        });
      } catch (e) {}
      return JSON.stringify({
        count: window.measureCount(),
        mode: measureMode,
        pts: measurePts.length,
        direct: direct, inGroup: inGroup, groups: groups,
        groupOnMap: !!measureGroup,
        rendererOnMap: !!measureRenderer
      });
    };

    // App 端接口：切换测量模式 / 清除
    window.setMeasureMode = function (mode) {
      measureMode = (mode === 'length' || mode === 'area') ? mode : null;
      if (measureMode) { doClearMeasure(); report('点击地图取点'); }
      else doClearMeasure();
    };
    // build121：原来这里写 `function(){ clearMeasure(); }`——而 `clearMeasure` 本身就是
    // 挂在 window 上的同名全局函数，赋值后 window.clearMeasure 变成"调用自己"，
    // 一调用就 RangeError: Maximum call stack size exceeded（页面报错、后续绘制中断）。
    // 内部实现改名 doClearMeasure 后不会互相遮蔽。
    window.clearMeasure = function () { doClearMeasure(); };

    // 页面就绪信号：脚本跑完就通知 App，之后 App 下发的工具/清除指令才不会落空
    try { if (window.Android && window.Android.mapReady) window.Android.mapReady(); } catch (e) {}
  </script>
</body>
</html>
