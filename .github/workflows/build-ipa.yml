name: Build Patrol IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # 项目可能在仓库根（ios-app 内容平铺），也可能在 ios-app/ 子目录，自动探测兼容两种结构
      - name: Detect project directory
        id: proj
        run: |
          if [ -f "$GITHUB_WORKSPACE/ios-app/project.yml" ]; then
            echo "workdir=$GITHUB_WORKSPACE/ios-app" >> "$GITHUB_OUTPUT"
            echo "relpath=ios-app" >> "$GITHUB_OUTPUT"
            echo "Project found in ios-app/"
          elif [ -f "$GITHUB_WORKSPACE/project.yml" ]; then
            echo "workdir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "relpath=." >> "$GITHUB_OUTPUT"
            echo "Project found in repository root"
          else
            echo "::error::project.yml not found in repository root or ios-app/"
            exit 1
          fi

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcode-select -p
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ${{ steps.proj.outputs.workdir }}
        run: xcodegen generate

      - name: Build unsigned IPA
        working-directory: ${{ steps.proj.outputs.workdir }}
        run: |
          set -e
          xcodebuild -project Patrol.xcodeproj -scheme Patrol \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Patrol.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=188 \
            clean archive
          mkdir -p build/Payload
          cp -R build/Patrol.xcarchive/Products/Applications/Patrol.app build/Payload/
          cd build
          zip -qry Patrol-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: Patrol-unsigned-ipa
          path: ${{ steps.proj.outputs.relpath }}/build/Patrol-unsigned.ipa
          retention-days: 14
