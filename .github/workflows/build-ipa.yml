name: Build Patrol IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcode-select -p
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build unsigned IPA
        working-directory: ios-app
        run: |
          set -e
          xcodebuild -project Patrol.xcodeproj -scheme Patrol \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Patrol.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=188 \
            clean archive
          mkdir -p build/Payload
          cp -R build/Patrol.xcarchive/Products/Applications/Patrol.app build/Payload/
          cd build
          zip -qry Patrol-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Patrol-unsigned-ipa
          path: ios-app/build/Patrol-unsigned.ipa
          retention-days: 14
